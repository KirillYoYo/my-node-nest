<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" xml:space="preserve">

  <!-- ФОН -->
    <g id="BACKGROUND">
    <rect style="fill:red;" width="750" height="500"/>
  </g>

    <!-- ГРАДИЕНТЫ ДЛЯ ПОДСВЕТКИ -->
    <defs>
    <!-- КРОНА: подсветка СПРАВА (тёмный слева → светлый справа) -->
        <linearGradient id="crown-right" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#292F44"/>
            <stop offset="40%" stop-color="#373D52"/>
            <stop offset="70%" stop-color="#5A6580"/>
            <stop offset="100%" stop-color="#A8B3D9"/>
    </linearGradient>

        <!-- КРОНА: подсветка СЛЕВА (светлый слева → тёмный справа) -->
        <linearGradient id="crown-left" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#A8B3D9"/>
            <stop offset="30%" stop-color="#5A6580"/>
            <stop offset="60%" stop-color="#373D52"/>
            <stop offset="100%" stop-color="#292F44"/>
    </linearGradient>

        <!-- СТВОЛ: подсветка СПРАВА -->
        <linearGradient id="bark-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D4C2A"/>
            <stop offset="50%" stop-color="#B8944A"/>
            <stop offset="100%" stop-color="#E8D5A3"/>
    </linearGradient>

        <!-- СТВОЛ: подсветка СЛЕВА -->
        <linearGradient id="bark-left" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8D5A3"/>
            <stop offset="50%" stop-color="#B8944A"/>
            <stop offset="100%" stop-color="#6D4C2A"/>
    </linearGradient>

        <!-- БЛИКИ (белые пятна): СПРАВА -->
        <radialGradient id="highlight-right" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
            <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#EDF0F7" stop-opacity="0"/>
    </radialGradient>

        <!-- БЛИКИ: СЛЕВА -->
        <radialGradient id="highlight-left" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
            <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#EDF0F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

